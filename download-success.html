<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiom Partner Plus ऐप — Install</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
  :root {
    --wiom-bg-default:        #FAF9FC;
    --wiom-bg-subtle:         #F1EDF7;
    --wiom-bg-brand:          #D9008D;
    --wiom-bg-brand-hover:    #C00080;
    --wiom-bg-brand-pressed:  #A30070;
    --wiom-bg-brand-bold:     #443152;
    --wiom-bg-brand-subtle:   #FFE5F6;

    --wiom-text-default:      #161021;
    --wiom-text-subtle:       #5C5570;
    --wiom-text-on-brand:     #FFFFFF;
    --wiom-text-brand:        #D9008D;
    --wiom-text-inverse:      #FAF9FC;

    --wiom-icon-action:       #352D42;
    --wiom-icon-brand:        #D9008D;

    --wiom-stroke-subtle:     #D7D3E0;
    --wiom-stroke-brand:      #FFB2E4;
    --wiom-stroke-brand-focus:#D9008D;

    --wiom-space-4:   4px;
    --wiom-space-8:   8px;
    --wiom-space-12:  12px;
    --wiom-space-16:  16px;
    --wiom-space-24:  24px;
    --wiom-space-32:  32px;
    --wiom-space-48:  48px;
    --wiom-space-64:  64px;

    --wiom-radius-medium:  12px;
    --wiom-radius-large:   16px;
    --wiom-radius-full:    9999px;

    --wiom-stroke-small:   1px;
    --wiom-stroke-medium:  2px;

    --wiom-shadow-md: 0 2px 6px 0 rgba(0,0,0,0.15);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Noto Sans', -apple-system, system-ui, sans-serif;
    background: var(--wiom-bg-default);
    color: var(--wiom-text-default);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.5;
  }

  .material-icons { user-select: none; vertical-align: middle; }

  .container-narrow {
    max-width: 680px;
    margin-inline: auto;
    width: 100%;
  }
  @media (max-width: 1023px) {
    .container-narrow { padding-inline: var(--wiom-space-24); }
  }
  @media (max-width: 767px) {
    .container-narrow { padding-inline: var(--wiom-space-16); }
  }

  /* ─── Top bar (help + lang toggle) ─── */
  .topbar {
    padding: var(--wiom-space-16) 0;
  }
  .topbar-inner {
    max-width: 680px;
    margin-inline: auto;
    padding-inline: var(--wiom-space-16);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--wiom-space-12);
  }
  @media (min-width: 768px) {
    .topbar-inner { padding-inline: var(--wiom-space-24); }
  }
  .help-link {
    font-size: 0.875rem;
    line-height: 1.25rem;
    font-weight: 700;
    color: var(--wiom-text-brand);
    text-decoration: none;
  }
  .help-link:hover { color: var(--wiom-bg-brand-hover); }

  /* Language toggle */
  .lang-toggle {
    display: inline-flex;
    align-items: center;
    background: var(--wiom-bg-default);
    border: 1px solid var(--wiom-stroke-subtle);
    border-radius: var(--wiom-radius-full);
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }
  .lang-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    min-height: 28px;
    padding: 4px 10px;
    border-radius: var(--wiom-radius-full);
    font-size: 0.75rem;
    line-height: 1rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--wiom-text-subtle);
    transition: background 0.12s, color 0.12s;
  }
  .lang-btn:hover { color: var(--wiom-text-default); }
  .lang-btn.active {
    background: var(--wiom-bg-brand);
    color: var(--wiom-text-on-brand);
  }

  /* ─── Main content ─── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: var(--wiom-space-16) 0 var(--wiom-space-32);
  }

  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--wiom-space-24);
    text-align: center;
  }

  /* ─── Partner+ app icon (recreated) ─── */
  .app-icon {
    width: 112px;
    height: 112px;
    background: #1E1E1E;
    border-radius: 24px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  }
  .app-icon-mark {
    /* Stylized infinity-like swirl in pink */
    color: var(--wiom-bg-brand);
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
    font-family: 'Noto Sans', sans-serif;
  }
  .app-icon-name {
    color: var(--wiom-text-on-brand);
    font-size: 0.875rem;
    line-height: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .app-icon-name .plus { font-weight: 700; }

  /* ─── Heading + Subhead ─── */
  .heading-block {
    display: flex;
    flex-direction: column;
    gap: var(--wiom-space-8);
    max-width: 520px;
  }
  .heading-block h1 {
    font-size: 1.25rem;
    line-height: 1.75rem;
    font-weight: 700;
    color: var(--wiom-text-default);
  }
  @media (min-width: 768px) {
    .heading-block h1 { font-size: 1.5rem; line-height: 2rem; }
  }
  .heading-block .subhead {
    font-size: 1rem;
    line-height: 1.5rem;
    font-weight: 600;
    color: var(--wiom-text-default);
  }
  @media (min-width: 768px) {
    .heading-block .subhead { font-size: 1.125rem; line-height: 1.75rem; }
  }

  /* ─── Illustration: stairs + flag + climber ─── */
  .illustration {
    width: 100%;
    max-width: 360px;
    margin: var(--wiom-space-16) 0;
  }
  .illustration svg { width: 100%; height: auto; display: block; }

  /* ─── Sticky CTA at bottom ─── */
  .cta-wrap {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--wiom-bg-default) 75%, transparent);
    padding: var(--wiom-space-16) 0 var(--wiom-space-24);
    margin-top: var(--wiom-space-24);
  }
  .cta-wrap-inner {
    max-width: 680px;
    margin-inline: auto;
    padding-inline: var(--wiom-space-16);
  }
  @media (min-width: 768px) {
    .cta-wrap-inner { padding-inline: var(--wiom-space-24); }
  }

  .cta-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--wiom-space-8);
    width: 100%;
    min-height: 56px;
    padding: var(--wiom-space-16) var(--wiom-space-24);
    background: var(--wiom-bg-brand);
    color: var(--wiom-text-on-brand);
    text-decoration: none;
    border: none;
    border-radius: var(--wiom-radius-full);
    font-size: 1rem;
    line-height: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.12s ease;
    box-shadow: 0 4px 16px rgba(217, 0, 141, 0.20);
  }
  .cta-primary:hover  { background: var(--wiom-bg-brand-hover); }
  .cta-primary:active { background: var(--wiom-bg-brand-pressed); }
  .cta-primary:focus-visible {
    outline: var(--wiom-stroke-medium) solid var(--wiom-stroke-brand-focus);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<!-- Top bar: मदद link + language toggle -->
<header class="topbar">
  <div class="topbar-inner">
    <a href="tel:7836811111" class="help-link">मदद</a>
    <div class="lang-toggle" role="group" aria-label="Language">
      <a href="download-success.html" class="lang-btn active" aria-current="page">हिं</a>
      <a href="download-success-en.html" class="lang-btn">EN</a>
    </div>
  </div>
</header>

<main>
  <div class="container-narrow">
    <div class="stack">

      <!-- Partner+ app icon -->
      <div class="app-icon" aria-hidden="true">
        <div class="app-icon-mark">∞</div>
        <div class="app-icon-name">partner <span class="plus">+</span></div>
      </div>

      <!-- Heading + subhead -->
      <div class="heading-block">
        <h1>व्योम के साथ पूरे करें अपने सारे सपने</h1>
        <p class="subhead">बिज़नेस को बढ़ाएं और 2x तक पैसा कमाएं</p>
      </div>

      <!-- Illustration -->
      <div class="illustration" aria-hidden="true">
        <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
          <!-- Stairs (4 ascending steps, light pink fills with brand-pink edges) -->
          <g>
            <!-- Step 1 (lowest) -->
            <rect x="60" y="170" width="60" height="36" fill="#FFE5F6" stroke="#D9008D" stroke-width="2" rx="2"/>
            <rect x="60" y="170" width="60" height="6" fill="#D9008D"/>
            <!-- Step 2 -->
            <rect x="120" y="148" width="60" height="58" fill="#FFE5F6" stroke="#D9008D" stroke-width="2" rx="2"/>
            <rect x="120" y="148" width="60" height="6" fill="#D9008D"/>
            <!-- Step 3 -->
            <rect x="180" y="126" width="60" height="80" fill="#FFE5F6" stroke="#D9008D" stroke-width="2" rx="2"/>
            <rect x="180" y="126" width="60" height="6" fill="#D9008D"/>
            <!-- Step 4 (highest, where flag stands) -->
            <rect x="240" y="104" width="60" height="102" fill="#FFE5F6" stroke="#D9008D" stroke-width="2" rx="2"/>
            <rect x="240" y="104" width="60" height="6" fill="#D9008D"/>
          </g>

          <!-- Flag pole + flag at top of stairs -->
          <g>
            <line x1="270" y1="104" x2="270" y2="30" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 271 32 Q 305 38 320 50 Q 305 62 271 60 Z" fill="#D9008D"/>
          </g>

          <!-- Climber figure (simplified, on step 2 climbing toward step 3) -->
          <g transform="translate(150, 110)">
            <!-- Head -->
            <circle cx="0" cy="0" r="9" fill="#161021"/>
            <!-- Hair tuft -->
            <path d="M -7 -6 Q -3 -12 4 -10 Q 8 -8 6 -4" fill="#1E1E1E"/>
            <!-- Body / pink jacket -->
            <path d="M -10 9 L -12 32 Q -10 36 -4 36 L 4 36 Q 10 36 12 32 L 10 9 Z" fill="#D9008D"/>
            <!-- Right arm (forward, climbing) -->
            <path d="M 8 12 Q 18 14 22 18" stroke="#D9008D" stroke-width="6" stroke-linecap="round" fill="none"/>
            <!-- Left arm (back) -->
            <path d="M -8 12 Q -14 18 -16 24" stroke="#D9008D" stroke-width="6" stroke-linecap="round" fill="none"/>
            <!-- Pants / legs -->
            <rect x="-9" y="34" width="6" height="20" fill="#5C5570" rx="2"/>
            <rect x="3" y="34" width="6" height="20" fill="#5C5570" rx="2"/>
          </g>
        </svg>
      </div>

    </div>
  </div>
</main>

<!-- Sticky CTA at bottom
     PREVIEW: links to # placeholder.
     PRODUCTION: replace href with the Wiom Branch deep link (handles Play Store / App Store routing):
                 https://wiom.app.link/aQLtpt7cVCb
                 (Source: traced from partner.wiom.in's "Get Partner+ App" CTA on 2026-05-06)
-->
<div class="cta-wrap">
  <div class="cta-wrap-inner">
    <a href="#" class="cta-primary" id="install-cta"
       data-production-href="https://wiom.app.link/aQLtpt7cVCb">
      <span>Wiom Partner Plus ऐप इनस्टॉल करें</span>
    </a>
  </div>
</div>

</body>
</html>
